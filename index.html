<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Nyasha Gabriel — Designer, Creative Developer and Builder." />
    <title>NYASHA.GABRIEL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ============================================================ -->
    <!-- LOADER — shown until assets.json fetches, hidden by main.js  -->
    <!-- ============================================================ -->
    <div id="site-loader" class="site-loader" aria-hidden="true">
      <div class="loader-content">
        <span id="loader-text" class="loader-text"></span>
      </div>
    </div>

    <!-- ============================================================ -->
    <!-- NAVIGATION (top bar)                                         -->
    <!-- ============================================================ -->
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a id="nav-brand" class="nav-brand" href="#hero" aria-label="Return home"></a>
        <div class="nav-desktop">
          <div id="desktop-nav-links" class="desktop-nav-links"></div>
        </div>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navigation-panel">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </nav>
    </header>

    <!-- ============================================================ -->
    <!-- NAVIGATION (slide-out panel, mobile + desktop "explore" menu) -->
    <!-- ============================================================ -->
    <aside id="navigation-panel" class="navigation-panel" aria-hidden="true">
      <div class="navigation-panel-header">
        <div>
          <span id="nav-eyebrow" class="panel-eyebrow"></span>
          <h2 id="nav-title"></h2>
        </div>
        <button id="menu-close" class="menu-close" type="button" aria-label="Close navigation menu">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="detailed-navigation" class="detailed-navigation"></div>
      <div class="navigation-panel-footer">
        <span id="nav-status-label"></span>
        <strong id="nav-status-value"></strong>
      </div>
    </aside>

    <div id="navigation-backdrop" class="navigation-backdrop"></div>

    <main>
      <!-- ============================================================ -->
      <!-- 00 · HERO                                                     -->
      <!-- ============================================================ -->
      <section id="hero" class="hero-scene">
        <picture class="hero-background">
          <source media="(max-width: 768px)" srcset="baseline_mobile.png" />
          <img src="baseline.png" alt="" aria-hidden="true" />
        </picture>
        <div class="hero-overlay" aria-hidden="true"></div>
        <div class="hero-frame" aria-hidden="true">
          <div class="frame-corner frame-corner-top-left"></div>
          <div class="frame-corner frame-corner-top-right"></div>
          <div class="frame-corner frame-corner-bottom-left"></div>
          <div class="frame-corner frame-corner-bottom-right"></div>
        </div>
        <div class="hero-content">
          <div class="hero-name" aria-label="Nyasha Gabriel">
            <span id="hero-first-name" class="hero-name-line"></span>
            <span id="hero-last-name" class="hero-name-line hero-name-accent"></span>
          </div>
          <div id="hero-roles" class="hero-roles"></div>
          <div id="hero-socials" class="hero-socials" aria-label="Social media links"></div>
          <p id="hero-quote" class="hero-quote"></p>
        </div>
        <a id="hero-scroll" class="hero-scroll" href="#about" aria-label="Scroll to about section">
          <span id="scroll-label" class="hero-scroll-label"></span>
          <span class="material-symbols-outlined hero-scroll-icon">keyboard_arrow_down</span>
        </a>
      </section>

      <!-- ============================================================ -->
      <!-- 01 · ABOUT + ROOTS (bio, skills, origin story, family)        -->
      <!-- ============================================================ -->
      <section id="about" class="scene about-scene">
        <div class="content-container">

          <div class="about-top-grid">
            <!-- Portrait + skill list -->
            <div class="about-visuals">
              <div class="profile-frame">
                <img id="profile-image" src="profile.webp" alt="Portrait" />
              </div>
              <ul id="skill-list" class="skill-list"></ul>
            </div>

            <!-- Bio + Roots story -->
            <div class="about-text">
              <div class="bio-block">
                <span id="about-index" class="section-index"></span>
                <h2 id="about-heading"></h2>
                <div id="about-bio" class="about-bio-content"></div>
              </div>

              <div class="origin-block">
                <span id="origin-index" class="section-index"></span>
                <h3 id="origin-heading"></h3>
                <div id="origin-story"></div>
                <span id="trait-badge" class="trait-badge"></span>
              </div>
            </div>
          </div>

          <!-- Family showcase: silhouettes + click/hover-to-reveal influence quote -->
          <div class="family-showcase-wrapper">
            <div id="family-silhouettes" class="family-showcase" role="img" aria-label="Family Figures">
              <div class="silhouette-figure" data-role="mother" style="--sil-h: 1;">
                <img class="silhouette-icon" src="family/mother.png" alt="Mother" />
                <span id="label-mother" class="silhouette-label"></span>
              </div>
              <div class="silhouette-figure" data-role="brother1" style="--sil-h: 0.9;">
                <img class="silhouette-icon" src="family/lil_bro1.png" alt="Younger Brother" />
                <span id="label-brother1" class="silhouette-label"></span>
              </div>
              <div class="silhouette-figure silhouette-figure--self" data-role="self" style="--sil-h: 0.86;">
                <img class="silhouette-icon" src="family/nyashagabriel.png" alt="Me" />
                <span id="label-self" class="silhouette-label"></span>
              </div>
              <div class="silhouette-figure" data-role="brother2" style="--sil-h: 0.82;">
                <img class="silhouette-icon" src="family/lil_bro2.png" alt="Younger Brother" />
                <span id="label-brother2" class="silhouette-label"></span>
              </div>
              <div class="silhouette-figure" data-role="sister" style="--sil-h: 0.68;">
                <img class="silhouette-icon" src="family/sister.png" alt="Older Sister" />
                <span id="label-sister" class="silhouette-label"></span>
              </div>
            </div>
            <!-- Filled + shown by main.js when a silhouette is clicked/focused -->
            <div id="family-quote-box" class="family-quote-box" aria-live="polite"></div>
          </div>

        </div>
      </section>

      <!-- ============================================================ -->
      <!-- 02 · TIMELINE (how I got here)                                -->
      <!-- ============================================================ -->
      <section id="timeline" class="scene">
        <div class="content-container">
          <div class="section-heading">
            <span id="timeline-index" class="section-index"></span>
            <h2 id="timeline-heading"></h2>
          </div>
          <ol id="timeline-list" class="timeline-list"></ol>
        </div>
      </section>

      <!-- ============================================================ -->
      <!-- 03 · CREATIVE WORK (client branding / digital design)         -->
      <!-- ============================================================ -->
      <section id="creative-work" class="scene">
        <div class="content-container">
          <div class="section-heading">
            <span id="creative-index" class="section-index"></span>
            <h2 id="creative-heading"></h2>
          </div>
          <div id="creative-projects" class="project-grid"></div>
        </div>
      </section>

      <!-- ============================================================ -->
      <!-- 04 · PRINT & DESIGN (print production, client + employer)     -->
      <!-- ============================================================ -->
      <section id="print-design" class="scene">
        <div class="content-container">
          <div class="section-heading">
            <span id="print-index" class="section-index"></span>
            <h2 id="print-heading"></h2>
          </div>
          <div id="experience-list" class="experience-list"></div>
        </div>
      </section>

      <!-- ============================================================ -->
      <!-- 05 · SYSTEMS / DEV PROJECTS                                   -->
      <!-- ============================================================ -->
      <section id="dev-projects" class="scene">
        <div class="content-container">
          <div class="section-heading">
            <span id="dev-index" class="section-index"></span>
            <h2 id="dev-heading"></h2>
          </div>
          <div id="development-projects" class="project-grid"></div>
        </div>
      </section>

      <!-- ============================================================ -->
      <!-- 06 · CURRENTLY BUILDING (terminal widget)                     -->
      <!-- ============================================================ -->
      <section id="currently-building" class="scene">
        <div class="content-container">
          <div class="section-heading">
            <span id="building-index" class="section-index"></span>
            <h2 id="building-heading"></h2>
          </div>
          <div class="terminal-container">
            <div class="terminal-header">
              <span id="terminal-title"></span>
            </div>
            <div id="terminal-body" class="terminal-body">
              <span class="terminal-cursor">_</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ============================================================ -->
      <!-- 07 · CONTACT                                                  -->
      <!-- ============================================================ -->
      <section id="contact" class="scene contact-scene">
        <div class="content-container">
          <div class="section-heading">
            <span id="contact-index" class="section-index"></span>
            <h2 id="contact-heading"></h2>
          </div>
          <div class="contact-layout">
            <div>
              <div id="contact-intro" class="contact-intro"></div>
              <div id="contact-socials" class="contact-socials">
                <a id="social-in" href="#" class="social-link"><img src="socials/in.png" alt="LinkedIn"></a>
                <a id="social-ig" href="#" class="social-link"><img src="socials/instagram.png" alt="Instagram"></a>
                <a id="social-tt" href="#" class="social-link"><img src="socials/tiktok.png" alt="TikTok"></a>
                <a id="social-yt" href="#" class="social-link"><img src="socials/you.png" alt="YouTube"></a>
              </div>
            </div>
            <div class="contact-status">
              <span id="contact-status-label" class="status-label"></span>
              <strong id="contact-status-value"></strong>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ============================================================ -->
    <!-- FOOTER                                                        -->
    <!-- ============================================================ -->
    <footer id="site-footer" class="site-footer">
      <div class="footer-background" aria-hidden="true">
        <img id="footer-bg-img" src="" alt="" />
        <div class="footer-overlay"></div>
      </div>

      <div class="content-container footer-content-wrapper">
        <div id="footer-columns" class="footer-columns"></div>

        <div class="footer-bottom">
          <span id="footer-copyright" class="footer-copyright"></span>
          <div id="footer-links" class="footer-links"></div>
        </div>
      </div>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
